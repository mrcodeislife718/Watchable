<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchable Creator Portal</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><h1>Watchable Creator Portal</h1><p class="muted">Submit films, series, comedy specials, stage, music, kids, podcasts and creator-led programming. Linked creator accounts also receive private title-level economics.</p><section class="card"><h2>Your creator economics</h2><pre id="dashboard">Loading…</pre></section><section class="card"><h2>Submit a project</h2><input id="title" placeholder="Project title"><input id="format" placeholder="Film, series, comedy special, concert, stage…"><input id="creator" placeholder="Creator / company"><textarea id="logline" placeholder="Logline"></textarea><button id="submit" class="btn">Submit to Watchable</button><p id="result"></p></section></main><script>async function api(p,o={}){const r=await fetch(p,{headers:{'content-type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}api('/api/creator/me').then(d=>dashboard.textContent=JSON.stringify(d,null,2)).catch(e=>dashboard.textContent=e.message);submit.onclick=async()=>{try{const r=await api('/api/creator/pitches',{method:'POST',body:JSON.stringify({title:title.value,format:format.value,creatorName:creator.value,logline:logline.value,rights:{creatorRetainsMeaningfulOwnership:true}})});result.textContent=`Submitted: ${r.id}`}catch(e){result.textContent=e.message}}</script></body></html>
