<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Watchable TV</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="hero" style="padding-top:50px"><h1 style="font-size:4rem">Welcome back.</h1><form class="form" id="form"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Sign in</button></form><div id="status"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();status.className='status';status.textContent='Signing in…';const d=Object.fromEntries(new FormData(form));const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const p=await r.json();if(r.ok)location.href='/app.html';else status.textContent=p.error}</script></body></html>
