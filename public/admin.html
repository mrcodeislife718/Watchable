<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchable Operations</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><h1>Watchable Operations</h1><section class="card"><h2>Operating dashboard</h2><pre id="dashboard">Loading…</pre><button class="btn secondary" id="refresh">Refresh</button></section><section class="card"><h2>Execute operation</h2><select id="action"><option>sponsor.create</option><option>sponsorship.create</option><option>ad.create</option><option>adInventory.set</option><option>creator.create</option><option>creator.finance</option><option>product.create</option><option>event.create</option><option>rights.record</option><option>franchise.create</option><option>franchise.right</option><option>pitch.review</option><option>project.create</option></select><textarea id="payload" style="width:100%;min-height:220px" placeholder='{"name":"Example"}'>{}</textarea><button class="btn" id="run">Run</button><pre id="result"></pre></section></main><script>async function api(p,o={}){const r=await fetch(p,{headers:{'content-type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{dashboard.textContent=JSON.stringify(await api('/api/admin/operations'),null,2)}catch(e){dashboard.textContent=e.message}}refresh.onclick=load;run.onclick=async()=>{try{const r=await api('/api/admin/operations',{method:'POST',body:JSON.stringify({action:action.value,payload:JSON.parse(payload.value||'{}')})});result.textContent=JSON.stringify(r,null,2);load()}catch(e){result.textContent=e.message}};load()</script></body></html>
