<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchable TV</title><link rel="stylesheet" href="/styles.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><header class="appbar"><div class="shell"><div class="brand">WATCHABLE</div><div style="display:flex;gap:8px;flex:1;max-width:520px"><input id="universalSearch" aria-label="Search Watchable" placeholder="Search shows, channels, creators, culture…" style="flex:1;padding:10px;border-radius:8px"><button id="voiceSearch" class="btn secondary" aria-label="Voice search">🎙</button></div><div class="tabs"><button data-tab="home" class="active">Home</button><button data-tab="live">Live</button><button data-tab="sports">Sports</button><button data-tab="premium">Premium</button><button data-tab="culture">Culture</button><button data-tab="kids">Kids</button><button data-tab="events">Events</button><button data-tab="shorts">Shorts</button><button data-tab="movies">Movies & Shows</button><button data-tab="dvr">DVR</button></div><span id="account" class="muted"></span></div></header><main class="shell"><div id="message"></div><section id="content"></section></main><div class="modal" id="modal"><div class="player"><video controls autoplay id="video"></video><div class="meta"><strong id="playerTitle"></strong> <button class="btn secondary" id="close">Close</button></div></div></div><script type="module" src="/app.js"></script><script type="module" src="/enhancements.js"></script></body></html>
