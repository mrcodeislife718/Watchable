name: Verify Watchable TV
on:
  push:
    branches: [main, launch/watchable-tv]
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify
        run: npm run check
